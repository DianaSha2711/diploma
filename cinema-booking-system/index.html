<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинотеатр - Бронирование билетов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="img/title.svg" alt="Идём в кино" width="300" height="150">
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#schedule">Расписание</a>
                <a class="nav-link" href="#films">Фильмы</a>
                <a class="nav-link" href="admin.html">Админ-панель</a>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        
        
        <section class="date-selector mb-5">
            <div class="date-scroll" id="dateScroll">
                
            </div>
        </section>

        
        <section id="schedule" class="mb-5">
            <h2 class="mb-4">Сеансы на <span id="currentDate"></span></h2>
            <div id="seanceList">
              
                <div class="col-12 text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Загрузка сеансов...</span>
                    </div>
                </div>
            </div>
        </section>

        
        <!--section id="films" class="mb-5">
            <h2 class="mb-4">Все фильмы</h2>
            <div class="row" id="filmList">
                
                <div class="col-12 text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Загрузка фильмов...</span>
                    </div>
                </div>
            </div>
        </section-->

    
        <div style="display: none;">
            <div id="movieList"></div>
            <div id="screeningList"></div>
        </div>
    </main>

    
    <div class="modal fade" id="bookingModal" tabindex="-1" aria-labelledby="bookingModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="bookingModalLabel">Выбор мест</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <div class="booking-container">
                        
                        <div class="hall-info mb-3 text-center text-muted">
                            Загрузка информации о зале...
                        </div>
                        
                        
                        <div class="hall-layout" id="hallLayout">
                            <div class="text-center p-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Загрузка схемы зала...</span>
                                </div>
                            </div>
                        </div>
                        
                        
                        <div class="booking-info mt-4 p-3 bg-light rounded">
                            <h6 class="mb-3"><i class="fas fa-ticket-alt me-2"></i>Выбранные места:</h6>
                            <div id="selectedSeats" class="mb-2">
                                <p class="text-muted mb-0">Места не выбраны</p>
                            </div>
                            <div class="total-price d-flex justify-content-between align-items-center">
                                <strong class="fs-5">Итого:</strong>
                                <span class="fs-4 fw-bold text-primary"><span id="totalPrice">0</span> ₽</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>Отмена
                    </button>
                    <button type="button" class="btn btn-primary" id="confirmBooking" disabled>
                        <i class="fas fa-check me-2"></i>Забронировать
                    </button>
                </div>
            </div>
        </div>
    </div>

    
    <div class="modal fade" id="ticketModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-check-circle text-success me-2"></i>
                        Бронирование подтверждено
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body text-center p-4">
                    <div id="ticketContent" class="ticket-content">
                       
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-primary" onclick="window.print()">
                        <i class="fas fa-print me-2"></i>Распечатать
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>Закрыть
                    </button>
                </div>
            </div>
        </div>
    </div>

    
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;"></div>

    
    <footer class="bg-light py-4 mt-5">
        <div class="container text-center">
            <p class="text-muted mb-0">© 2024 Кинотеатр "Идём в кино"</p>
        </div>
    </footer>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>

    
   

    
    <script>
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 HTML загружен, проверка API...');
            
            
            if (typeof cinemaAPI !== 'undefined') {
                console.log('✅ CinemaAPI доступен');
            } else {
                console.error('❌ CinemaAPI не найден!');
            }
            
            
            console.log('📋 Элементы страницы:', {
                filmList: document.getElementById('filmList') ? '✅' : '❌',
                seanceList: document.getElementById('seanceList') ? '✅' : '❌',
                dateScroll: document.getElementById('dateScroll') ? '✅' : '❌'
            });
        });
    </script>
</body>
</html>
