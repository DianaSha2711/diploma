<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Идём в кино - Бронирование билетов</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
	<header>
		<img src="img/title.svg" alt="Идём в кино" width="300">
		<a class="btn" href="admin.html"><div>ВОЙТИ</div></a>
	</header>

    <main id="main_panel">
        <section class="date_selector">
            <div class="date_scroll" id="dateScroll"></div>
        </section>
		<section id="seanceList">
			<span class="visually-hidden">Загрузка сеансов...</span>
		</section>
    </main>

    
    <div id="bookingPanel" class="modal_dialog">
		<div class="book_header">
			<h4 id="film_name">Kino</h4>
			<h5 id="film_time">12:00</h5>
			<h4 id="hall_name">Zal 1</h4>
		</div>
		<div class="booking_container flex_vert">
			<img src="img/screen.png" id="screen_png">
			<div id="hallLayout"></div>
		</div>
		<div id="hallLegend"></div>
		<div class="book_footer">
			<button class="btn btn_primary" id="confirmBooking">ЗАБРОНИРОВАТЬ</button>
			<button class="btn btn_secondary cancelBooking">ОТМЕНА</button>
		</div>
    </div>
	<div id="bookedTikets" class="modal_dialog">
		<div class="perfored_top">ВЫ ВЫБРАЛИ БИЛЕТЫ:</div>
		<div id="bookingInfo"></div>
		<div class="book_footer">
			<button class="btn btn_secondary" id="backToChoosing">ВЕРНУТЬСЯ К ВЫБОРУ МЕСТ</button>
			<button class="btn btn_primary" id="getGrCode">ПОЛУЧИТЬ КОД БРОНИРОВАНИЯ</button>
			<button class="btn btn_secondary cancelBooking">ОТМЕНА</button>
		</div>
		<div class="booked_footer">После оплаты билет будет доступен в этом окне, а также придёт вам на почту. Покажите QR-код нашему контроллёру у входа в зал.</div>
	</div>

	<div id="bookedGrQode" class="modal_dialog">
		<div class="book_footer">
			<button class="btn btn_secondary cancelBooking">OK</button>
		</div>
	</div>

    <footer>
        © 2026 Кинотеатр "Идём в кино"
    </footer>

    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
